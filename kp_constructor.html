<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Старт Мебель · Конструктор КП</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --dark: #1a1714;
    --accent: #8b6f47;
    --accent-light: #c9a97a;
    --border: #d4c5b0;
    --gray: #6b6560;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    font-family: 'Jost', sans-serif;
    color: var(--dark);
    min-height: 100vh;
  }

  /* ===== FORM UI ===== */
  #app {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .header {
    text-align: center;
    margin-bottom: 48px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--border);
  }

  .header-label {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    font-weight: 300;
    letter-spacing: 2px;
    line-height: 1.1;
  }

  .header p {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--gray);
    margin-top: 8px;
    text-transform: uppercase;
  }

  .step-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 32px;
  }

  .step-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s;
  }
  .step-dot.active { background: var(--accent); }
  .step-dot.done { background: var(--accent-light); }

  .step-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray);
    margin-left: 8px;
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .field-group { margin-bottom: 20px; }

  label {
    display: block;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  input[type="text"], input[type="date"], input[type="number"], textarea, select {
    width: 100%;
    background: white;
    border: 1px solid var(--border);
    padding: 12px 16px;
    font-family: 'Jost', sans-serif;
    font-size: 14px;
    color: var(--dark);
    outline: none;
    transition: border-color 0.2s;
    border-radius: 2px;
  }

  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
  }

  textarea { resize: vertical; min-height: 80px; }

  .position-card {
    background: white;
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 16px;
    border-radius: 2px;
    position: relative;
  }

  .position-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .position-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    color: var(--accent-light);
    font-weight: 300;
  }

  .btn-remove {
    background: none;
    border: 1px solid var(--border);
    color: var(--gray);
    padding: 4px 12px;
    cursor: pointer;
    font-size: 11px;
    letter-spacing: 1px;
    border-radius: 2px;
    transition: all 0.2s;
  }
  .btn-remove:hover { border-color: #c0392b; color: #c0392b; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  .photo-upload {
    border: 2px dashed var(--border);
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    border-radius: 2px;
    background: #faf8f5;
    position: relative;
  }
  .photo-upload:hover { border-color: var(--accent); }
  .photo-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .photo-upload-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray);
  }
  .photo-preview {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
  }
  .photo-preview img {
    width: 80px; height: 60px; object-fit: cover; border-radius: 2px;
    border: 1px solid var(--border);
  }

  .btn-add {
    width: 100%;
    padding: 14px;
    background: none;
    border: 1px dashed var(--accent);
    color: var(--accent);
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 2px;
    margin-top: 8px;
  }
  .btn-add:hover { background: var(--accent); color: white; }

  .btn-generate {
    width: 100%;
    padding: 18px;
    background: var(--dark);
    border: none;
    color: white;
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    border-radius: 2px;
    margin-top: 32px;
  }
  .btn-generate:hover { background: var(--accent); }

  .total-preview {
    background: var(--dark);
    color: white;
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    border-radius: 2px;
  }
  .total-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent-light); }
  .total-amount { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; }

  /* ===== PDF OUTPUT ===== */
  #pdf-output {
    display: none;
    max-width: 900px;
    margin: 0 auto;
  }

  .pdf-page {
    background: white;
    padding: 60px 56px;
    margin-bottom: 2px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
  }

  .pdf-header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 40px;
  }

  .pdf-label {
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .pdf-brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    font-weight: 300;
    font-style: italic;
    color: var(--dark);
    line-height: 1;
  }

  .pdf-subtitle {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--gray);
    text-transform: uppercase;
    margin-top: 4px;
  }

  .pdf-date {
    font-size: 11px;
    color: var(--gray);
    text-align: right;
    letter-spacing: 1px;
  }

  .pdf-address-block {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 40px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--border);
  }

  .pdf-address-icon { color: var(--accent); font-size: 14px; margin-top: 2px; }

  .pdf-address-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .pdf-address-text { font-size: 13px; color: var(--dark); }

  .pdf-section-title {
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
  }

  .pdf-table { width: 100%; border-collapse: collapse; }
  .pdf-table thead tr {
    border-bottom: 1px solid var(--border);
  }
  .pdf-table th {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gray);
    padding: 8px 0;
    text-align: left;
    font-weight: 400;
  }
  .pdf-table th:last-child { text-align: right; }
  .pdf-table td {
    padding: 14px 0;
    font-size: 13px;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
  }
  .pdf-table td:last-child { text-align: right; font-weight: 500; }
  .pdf-table .row-num { color: var(--accent-light); font-size: 11px; width: 32px; }
  .pdf-table .row-qty { color: var(--gray); font-size: 12px; }

  .pdf-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0;
    margin-top: 8px;
    border-top: 2px solid var(--dark);
  }
  .pdf-total-label {
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gray);
  }
  .pdf-total-amount {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 300;
  }

  .pdf-viz-title {
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 40px;
    margin-bottom: 16px;
  }

  .pdf-viz-img {
    width: 100%;
    max-height: 300px;
    object-fit: contain;
    border: 1px solid var(--border);
  }

  /* Position detail page */
  .pdf-pos-page {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    align-items: start;
    padding: 60px 56px;
    background: white;
    margin-bottom: 2px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
  }

  .pdf-pos-img-wrap {
    background: #f9f7f4;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    overflow: hidden;
  }
  .pdf-pos-img-wrap img { width: 100%; height: 220px; object-fit: contain; }

  .pdf-pos-num {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .pdf-pos-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 400;
    margin-bottom: 4px;
    line-height: 1.2;
  }

  .pdf-pos-accent { width: 32px; height: 2px; background: var(--accent); margin: 12px 0 20px; }

  .pdf-spec-row {
    padding: 10px 0;
    border-bottom: 1px solid #eee;
  }
  .pdf-spec-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
  .pdf-spec-value { font-size: 13px; }

  .pdf-pos-price {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pdf-pos-price-label { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--gray); }
  .pdf-pos-price-amount { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; }

  .pdf-page-footer {
    font-size: 9px;
    color: var(--gray);
    letter-spacing: 1px;
    text-align: center;
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .action-bar {
    text-align: center;
    padding: 32px;
    background: var(--cream);
  }

  .btn-print {
    padding: 16px 48px;
    background: var(--dark);
    color: white;
    border: none;
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    margin: 0 8px;
  }
  .btn-back {
    padding: 16px 48px;
    background: none;
    color: var(--dark);
    border: 1px solid var(--border);
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    margin: 0 8px;
  }

  @media print {
    #app, .action-bar { display: none !important; }
    #pdf-output { display: block !important; }
    .pdf-page, .pdf-pos-page { box-shadow: none; page-break-after: always; }
  }
</style>
</head>
<body>

<!-- FORM -->
<div id="app">
  <div class="header">
    <div class="header-label">Конструктор документов</div>
    <h1>Старт Мебель</h1>
    <p>Коммерческое предложение</p>
  </div>

  <!-- Step 1: General Info -->
  <div id="step1">
    <div class="step-indicator">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
      <span class="step-label">Шаг 1 — Общая информация</span>
    </div>

    <div class="section-title">Данные клиента</div>

    <div class="field-group">
      <label>Дата КП</label>
      <input type="date" id="kp-date">
    </div>
    <div class="field-group">
      <label>Адрес поставки</label>
      <input type="text" id="kp-address" placeholder="г. Москва, ул. Примерная, 1, кв. 1">
    </div>

    <div class="section-title" style="margin-top:32px;">Визуализация проекта</div>
    <div class="photo-upload" id="viz-upload-area">
      <input type="file" accept="image/*" multiple onchange="handleVizPhotos(this)">
      <div class="photo-upload-label">📷 Загрузить фото / визуализацию проекта</div>
      <div class="photo-preview" id="viz-preview"></div>
    </div>

    <button class="btn-generate" onclick="goStep2()">Далее → Позиции</button>
  </div>

  <!-- Step 2: Positions -->
  <div id="step2" style="display:none;">
    <div class="step-indicator">
      <div class="step-dot done"></div>
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <span class="step-label">Шаг 2 — Позиции заказа</span>
    </div>

    <div class="section-title">Состав заказа</div>
    <div id="positions-list"></div>
    <button class="btn-add" onclick="addPosition()">+ Добавить позицию</button>

    <div class="total-preview">
      <div>
        <div class="total-label">Итого к оплате</div>
      </div>
      <div class="total-amount" id="total-display">0 ₽</div>
    </div>

    <button class="btn-generate" onclick="generatePDF()">Сформировать КП →</button>
  </div>
</div>

<!-- PDF OUTPUT -->
<div id="pdf-output"></div>

<script>
let vizPhotos = [];
let positions = [];
let posPhotoData = {};

function handleVizPhotos(input) {
  const files = Array.from(input.files);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      vizPhotos.push(e.target.result);
      const img = document.createElement('img');
      img.src = e.target.result;
      document.getElementById('viz-preview').appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}

function goStep2() {
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
  if (positions.length === 0) addPosition();
}

let posCounter = 0;
function addPosition() {
  const id = ++posCounter;
  positions.push(id);
  posPhotoData[id] = [];

  const card = document.createElement('div');
  card.className = 'position-card';
  card.id = `pos-${id}`;
  card.innerHTML = `
    <div class="position-header">
      <div class="position-num">№ ${String(id).padStart(2,'0')}</div>
      <button class="btn-remove" onclick="removePos(${id})">Удалить</button>
    </div>
    <div class="field-group">
      <label>Наименование</label>
      <input type="text" id="pos-name-${id}" placeholder="Кухонный гарнитур" onchange="updateTotal()">
    </div>
    <div class="grid-3">
      <div class="field-group">
        <label>Кол-во (шт)</label>
        <input type="number" id="pos-qty-${id}" value="1" min="1" onchange="updateTotal()">
      </div>
      <div class="field-group" style="grid-column: span 2">
        <label>Стоимость (₽)</label>
        <input type="number" id="pos-price-${id}" placeholder="0" onchange="updateTotal()">
      </div>
    </div>
    <div class="grid-2">
      <div class="field-group">
        <label>Материал корпуса</label>
        <input type="text" id="pos-corp-${id}" placeholder="ЛДСП Эггер">
      </div>
      <div class="field-group">
        <label>Материал фасадов</label>
        <input type="text" id="pos-fas-${id}" placeholder="МДФ пленка">
      </div>
    </div>
    <div class="field-group">
      <label>Фурнитура</label>
      <input type="text" id="pos-furn-${id}" placeholder="Blum (Австрия)">
    </div>
    <div class="field-group">
      <label>Фото / чертёж изделия</label>
      <div class="photo-upload">
        <input type="file" accept="image/*" multiple onchange="handlePosPhoto(this, ${id})">
        <div class="photo-upload-label">📷 Загрузить фото изделия</div>
        <div class="photo-preview" id="pos-preview-${id}"></div>
      </div>
    </div>
  `;
  document.getElementById('positions-list').appendChild(card);
}

function removePos(id) {
  const idx = positions.indexOf(id);
  if (idx > -1) positions.splice(idx, 1);
  document.getElementById(`pos-${id}`).remove();
  updateTotal();
}

function handlePosPhoto(input, id) {
  const files = Array.from(input.files);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      posPhotoData[id] = posPhotoData[id] || [];
      posPhotoData[id].push(e.target.result);
      const img = document.createElement('img');
      img.src = e.target.result;
      document.getElementById(`pos-preview-${id}`).appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}

function updateTotal() {
  let total = 0;
  positions.forEach(id => {
    const price = parseFloat(document.getElementById(`pos-price-${id}`)?.value || 0);
    if (!isNaN(price)) total += price;
  });
  document.getElementById('total-display').textContent = formatMoney(total) + ' ₽';
}

function formatMoney(n) {
  return Math.round(n).toLocaleString('ru-RU');
}

function formatDate(str) {
  if (!str) return new Date().toLocaleDateString('ru-RU', {day:'numeric',month:'long',year:'numeric'});
  const d = new Date(str);
  return d.toLocaleDateString('ru-RU', {day:'numeric',month:'long',year:'numeric'});
}

function generatePDF() {
  const date = formatDate(document.getElementById('kp-date').value);
  const address = document.getElementById('kp-address').value || 'Не указан';

  // Collect positions data
  const posData = positions.map((id, i) => ({
    num: String(i+1).padStart(2,'0'),
    name: document.getElementById(`pos-name-${id}`)?.value || '—',
    qty: document.getElementById(`pos-qty-${id}`)?.value || '1',
    price: parseFloat(document.getElementById(`pos-price-${id}`)?.value || 0),
    corp: document.getElementById(`pos-corp-${id}`)?.value || '—',
    fas: document.getElementById(`pos-fas-${id}`)?.value || '—',
    furn: document.getElementById(`pos-furn-${id}`)?.value || '—',
    photos: posPhotoData[id] || []
  }));

  const total = posData.reduce((s, p) => s + p.price, 0);
  const totalPages = 1 + posData.length;

  let html = '';

  // PAGE 1 — Summary
  html += `
  <div class="pdf-page">
    <div class="pdf-header-top">
      <div>
        <div class="pdf-label">Коммерческое предложение</div>
        <div class="pdf-brand">Старт Мебель</div>
        <div class="pdf-subtitle">Мебель на заказ · Производство и поставка</div>
      </div>
      <div class="pdf-date">${date}</div>
    </div>

    <div class="pdf-address-block">
      <div class="pdf-address-icon">◎</div>
      <div>
        <div class="pdf-address-label">Адрес поставки</div>
        <div class="pdf-address-text">${address}</div>
      </div>
    </div>

    <div class="pdf-section-title">Состав заказа</div>
    <table class="pdf-table">
      <thead>
        <tr>
          <th style="width:32px">№</th>
          <th>Наименование</th>
          <th style="width:80px">Кол-во</th>
          <th style="width:120px">Стоимость</th>
        </tr>
      </thead>
      <tbody>
        ${posData.map(p => `
          <tr>
            <td class="row-num">${p.num}</td>
            <td>${p.name}</td>
            <td class="row-qty">${p.qty} шт.</td>
            <td>${formatMoney(p.price)} ₽</td>
          </tr>
        `).join('')}
      </tbody>
    </table>

    <div class="pdf-total-row">
      <div class="pdf-total-label">Итого к оплате</div>
      <div class="pdf-total-amount">${formatMoney(total)} ₽</div>
    </div>

    ${vizPhotos.length > 0 ? `
      <div class="pdf-viz-title">Визуализация проекта</div>
      ${vizPhotos.map(src => `<img class="pdf-viz-img" src="${src}">`).join('')}
    ` : ''}

    <div class="pdf-page-footer">Старт Мебель · Коммерческое предложение &nbsp;&nbsp; 1 / ${totalPages}</div>
  </div>`;

  // PAGES — Each position
  posData.forEach((p, i) => {
    const photoHtml = p.photos.length > 0
      ? `<img src="${p.photos[0]}" style="width:100%;height:220px;object-fit:contain;">`
      : `<div style="height:220px;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:12px;letter-spacing:2px;">НЕТ ФОТО</div>`;

    html += `
    <div class="pdf-pos-page">
      <div>
        <div class="pdf-pos-img-wrap">${photoHtml}</div>
        ${p.photos.length > 1 ? p.photos.slice(1).map(src => `<img src="${src}" style="width:100%;margin-top:8px;border:1px solid #ddd;object-fit:contain;max-height:160px;">`).join('') : ''}
      </div>
      <div>
        <div class="pdf-pos-num">№ ${p.num}</div>
        <div class="pdf-pos-name">${p.name}</div>
        <div class="pdf-pos-accent"></div>

        <div class="pdf-spec-row">
          <div class="pdf-spec-label">Материал корпуса</div>
          <div class="pdf-spec-value">${p.corp}</div>
        </div>
        <div class="pdf-spec-row">
          <div class="pdf-spec-label">Материал фасадов</div>
          <div class="pdf-spec-value">${p.fas}</div>
        </div>
        <div class="pdf-spec-row">
          <div class="pdf-spec-label">Фурнитура</div>
          <div class="pdf-spec-value">${p.furn}</div>
        </div>

        <div class="pdf-pos-price">
          <div class="pdf-pos-price-label">Стоимость</div>
          <div class="pdf-pos-price-amount">${formatMoney(p.price)} ₽</div>
        </div>

        <div class="pdf-page-footer" style="margin-top:40px;">Старт Мебель · Коммерческое предложение &nbsp;&nbsp; ${i+2} / ${totalPages}</div>
      </div>
    </div>`;
  });

  document.getElementById('pdf-output').innerHTML = `
    <div class="action-bar">
      <button class="btn-back" onclick="goBack()">← Редактировать</button>
      <button class="btn-print" onclick="window.print()">🖨 Сохранить / Печать</button>
    </div>
    ${html}
    <div class="action-bar">
      <button class="btn-back" onclick="goBack()">← Редактировать</button>
      <button class="btn-print" onclick="window.print()">🖨 Сохранить / Печать</button>
    </div>
  `;

  document.getElementById('app').style.display = 'none';
  document.getElementById('pdf-output').style.display = 'block';
  window.scrollTo(0, 0);
}

function goBack() {
  document.getElementById('app').style.display = 'block';
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
  document.getElementById('pdf-output').style.display = 'none';
}

// Set today's date
document.getElementById('kp-date').valueAsDate = new Date();
</script>
</body>
</html>
